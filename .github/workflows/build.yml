name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [build-pre-rel]
jobs:
  build:
    name: Build
    #runs-on: SumatraBuilder
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out source code
        uses: actions/checkout@v6
        with:
          # needed to calc build number via git log --oneline
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build
        env:
          R2_SECRET: ${{ secrets.R2_SECRET }}
          R2_ACCESS: ${{ secrets.R2_ACCESS }}
          BB_SECRET: ${{ secrets.BB_SECRET }}
          BB_ACCESS: ${{ secrets.BB_ACCESS }}
        run: bun .\cmd\build-ci.ts

      - name: Prepare downloadable artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Copy-Item out\rel64\SumatraPDF-dll.exe artifacts\SumatraPDF-prerel-64-install.exe
          Copy-Item out\rel64\SumatraPDF.exe artifacts\SumatraPDF-prerel-64-portable.exe

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: SumatraPDF-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
